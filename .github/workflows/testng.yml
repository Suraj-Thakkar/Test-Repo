name: Selenium Test Execution

on:
  push:
    branches: [ "main", "yogi" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libosmesa6 libgl1-mesa-dri libglx-mesa0

      - name: Create Folders for Artifacts
        # Pre-creating folders ensures the Screen Recorder has a place to write the .avi file
        run: mkdir -p recordings screenshots

      - name: Run Tests with Virtual Display
        # The resolution matches your Java Rectangle(0, 0, 1920, 1080)
        run: xvfb-run --server-args="-screen 0 1920x1080x24" mvn test

      - name: Upload AVI Recordings and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-artifacts
          path: |
            recordings/*.avi
            screenshots/*.png
            target/surefire-reports/