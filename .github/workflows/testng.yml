name: Selenium Test Execution

on:
  push:
    branches: [ "main", "yogi" ]    # Added yogi branch since you are working there
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:                # Allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven              # Speeds up subsequent runs by caching dependencies

      - name: Install Dependencies
        # Added mesa libraries to prevent screen recording "black screen" issues
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libosmesa6 libgl1-mesa-glx

      - name: Run Tests with Virtual Display
        # We use a standard 1920x1080 resolution to match your Java code's capture area
        run: xvfb-run --server-args="-screen 0 1920x1080x24" mvn test

      - name: Upload Execution Reports
        if: always()                # Ensures reports upload even if the test fails
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-artifacts
          path: |
            recordings/
            screenshots/
            target/surefire-reports/